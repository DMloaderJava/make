name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    # Windows проверяем отдельно: пути, npm-скрипты и .bat-лаунчеры ломаются
    # именно там, а без матрицы такие регрессии всплывают только у пользователей.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: postinstall Electron в CI не нужен и часто падает по TLS
      - name: Установка зависимостей
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm run test

      - name: ESLint
        run: npm run lint

      - name: Сборка
        run: npm run build

      # Проверяем, что .bat-лаунчеры хотя бы существуют и не деградировали:
      # в них не должно остаться npm-вызовов без --no-audit --no-fund.
      - name: Лаунчеры согласованы (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # ^ якорим на начало строки: в .bat есть подсказки вида
          # «echo ... npm install @aws-sdk/client-polly --no-save», их не считаем.
          $bad = Select-String -Path *.bat -Pattern '^\s*(call\s+)?npm\s+(ci|install)\b(?!.*--no-audit)'
          if ($bad) {
            $bad | ForEach-Object { Write-Error "$($_.Filename):$($_.LineNumber): $($_.Line.Trim())" }
            exit 1
          }
          Write-Host "Все npm-вызовы в .bat содержат --no-audit --no-fund"

