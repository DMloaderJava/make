name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: postinstall Electron в CI не нужен и часто падает по TLS
      - name: Установка зависимостей
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm run test

      - name: ESLint
        run: npm run lint

      - name: Сборка
        run: npm run build
